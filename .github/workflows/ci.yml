name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Elm
        uses: jorelali/setup-elm@v6
        with:
          elm-version: 0.19.1

      - name: Install elm-test-rs
        run: |
          curl -sL -o elm-test-rs.tar.gz \
            https://github.com/mpizenberg/elm-test-rs/releases/download/v3.2.0/elm-test-rs_linux.tar.gz
          tar xzf elm-test-rs.tar.gz
          sudo mv elm-test-rs /usr/local/bin/elm-test-rs
          chmod +x /usr/local/bin/elm-test-rs

      # cargo test also compiles the Elm app via build.rs (needs elm on PATH).
      - name: Rust tests
        run: cargo test

      - name: Elm tests
        run: elm-test-rs
        working-directory: elm
